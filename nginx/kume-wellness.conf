server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name espaciokume.com.ar www.espaciokume.com.ar _;

    root /var/www/kume-wellness;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript;
}
