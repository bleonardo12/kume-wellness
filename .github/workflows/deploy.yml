name: Deploy a VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Copiar archivos al VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.github' --exclude='.claude'
          path: ./
          remote_path: ${{ secrets.VPS_PATH }}
          remote_host: 69.62.95.98
          remote_port: 2222
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verificar deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 69.62.95.98
          port: 2222
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "✅ Deploy completado: $(date)"
            ls -la ${{ secrets.VPS_PATH }}
