name: Deploy a VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configurar SSH para omitir verificación de host
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << 'EOF'
          Host 69.62.95.98
            Port 2222
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Copiar archivos via rsync
        run: |
          rsync -avzr --delete \
            -e "ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='*.md' \
            ./ root@69.62.95.98:${{ secrets.VPS_PATH }}/

      - name: Verificar deploy
        run: |
          ssh root@69.62.95.98 "echo 'Deploy OK:' && date && ls ${{ secrets.VPS_PATH }}"
