name: Deploy al VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar SSH Agent y Clave
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Registrar Host de Confianza
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 -H srv777726.hstgr.cloud >> ~/.ssh/known_hosts

      - name: Deploy al VPS
        run: |
          ssh -p 2222 root@srv777726.hstgr.cloud << 'ENDSSH'
            set -e
            echo "📦 Iniciando deploy..."

            if [ -d "/var/www/kume-wellness/.git" ]; then
              echo "🔄 Repo encontrado, actualizando..."
              cd /var/www/kume-wellness
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📥 Repo no encontrado, clonando..."
              rm -rf /var/www/kume-wellness
              git clone https://github.com/bleonardo12/kume-wellness.git /var/www/kume-wellness
              cd /var/www/kume-wellness
            fi

            echo "✅ Último commit desplegado:"
            git log -1 --oneline

            echo "🎉 Deploy completado exitosamente!"
          ENDSSH

      - name: Configurar nginx
        run: |
          scp -P 2222 nginx/kume-wellness.conf root@srv777726.hstgr.cloud:/etc/nginx/sites-available/kume-wellness
          ssh -p 2222 root@srv777726.hstgr.cloud "ln -sf /etc/nginx/sites-available/kume-wellness /etc/nginx/sites-enabled/kume-wellness && rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx && echo '✅ nginx recargado'"

      - name: Notificar resultado
        if: success()
        run: echo "✅ Deploy exitoso a srv777726.hstgr.cloud"
