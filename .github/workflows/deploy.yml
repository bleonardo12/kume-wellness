name: Deploy a VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Agregar VPS a known_hosts
        run: ssh-keyscan -p 2222 -H 69.62.95.98 >> ~/.ssh/known_hosts

      - name: Copiar archivos via rsync
        run: |
          rsync -avzr --delete \
            -e "ssh -p 2222 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='*.md' \
            ./ root@69.62.95.98:${{ secrets.VPS_PATH }}/

      - name: Verificar deploy
        run: |
          ssh -p 2222 root@69.62.95.98 "echo 'Deploy OK:' && date && ls ${{ secrets.VPS_PATH }}"
